<h2 mat-dialog-title>{{data.title}}</h2><mat-dialog-content>{{data.message}}</mat-dialog-content><mat-dialog-actions align="end"><button type="button" [mat-dialog-close]="false">{{data.cancelLabel || "Cancelar"}}</button><button type="button" class="primary" [mat-dialog-close]="true">{{data.confirmLabel || "Confirmar"}}</button></mat-dialog-actions>
