<h2 mat-dialog-title>Modificar secuencia {{itemSequence}}</h2><form #itemForm="ngForm" (ngSubmit)="saveItem()"><mat-dialog-content><div class="feedback error" *ngIf="itemError" role="alert">{{itemError}}</div><fieldset [disabled]="itemSaving" style="border:0;padding:0" *ngIf="itemEdit as item"><div class="item-edit-fields"><label>Cantidad comprada<input type="number" name="purchased" [(ngModel)]="item.purchased" min="0" max="100000000" step="0.00001" required></label><label>Precio unitario<input type="number" name="price" [(ngModel)]="item.unitPrice" min="0" max="99999999" step="0.00001" required></label><app-catalog-combobox label="Descuento" name="discount" [showCode]="false" [(ngModel)]="item.discountCode" [options]="itemDiscounts" required></app-catalog-combobox><label>IGV (%)<input type="number" name="tax" [(ngModel)]="item.taxPercent" min="0" max="100" step="0.01" required></label><label>Entrega desde<input type="date" name="start" [(ngModel)]="item.deliveryStart" required></label><label>Entrega hasta<input type="date" name="end" [(ngModel)]="item.deliveryEnd" [min]="item.deliveryStart" required></label></div><label>Observaciones<textarea name="notes" [(ngModel)]="item.observations" maxlength="2000" rows="3" style="width:100%"></textarea></label></fieldset></mat-dialog-content><mat-dialog-actions align="end"><button type="button" mat-dialog-close [disabled]="itemSaving">Cancelar</button><button class="primary" type="submit" [disabled]="itemSaving||itemForm.invalid">{{itemSaving ? 'Guardando…' : 'Guardar cambios'}}</button></mat-dialog-actions></form>
