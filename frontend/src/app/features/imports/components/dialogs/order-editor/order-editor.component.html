<h2 mat-dialog-title>Órdenes de Compra</h2><mat-dialog-content><form (submit)="$event.preventDefault()" autocomplete="off"><div class="fields"><div class="warehouse"><label class="warehouse-code">Código<input aria-label="Código de almacén" [value]="order.warehouse" readonly></label><app-catalog-combobox label="Tipo de almacén" name="warehouse" [(ngModel)]="order.warehouse" (ngModelChange)="invalidate()" [showCode]="false" [options]="warehouses" [disabled]="catalogBusy" required></app-catalog-combobox></div><div class="order-number"><label>Serie O/Compra<input name="series" [(ngModel)]="order.series" (ngModelChange)="invalidate()" (keydown.enter)="consult($event)" maxlength="3" required></label><label>Número O/Compra<input name="number" [(ngModel)]="order.number" (ngModelChange)="invalidate()" (keydown.enter)="consult($event)" (blur)="consult()" maxlength="6" required></label></div><div class="summary"><label>Fecha<input aria-label="Fecha" [value]="date" readonly></label><label>Importe<input aria-label="Importe" [value]="detail?(detail['importe']|number:'1.2-2'):''" readonly></label></div><div><span class="currency-label">Código moneda</span><div class="currency"><input aria-label="Código moneda" [value]="detail?.['cod_moneda']||''" readonly><input aria-label="Descripción de moneda" [value]="detail?.['nom_moneda']||''" readonly></div></div></div><p class="muted" role="status" *ngIf="busy">Consultando orden de compra…</p><p class="feedback error" role="alert" *ngIf="error">{{error}}</p><small class="muted">Ingresa serie y número y pulsa Enter para consultar. La asociación se aplicará al guardar la importación.</small></form></mat-dialog-content><mat-dialog-actions align="end"><button class="primary" type="button" (click)="accept()" [disabled]="!isGlobalUser&&(!detail||busy||catalogBusy)">Aceptar</button><button type="button" mat-dialog-close>Cancelar</button></mat-dialog-actions>
