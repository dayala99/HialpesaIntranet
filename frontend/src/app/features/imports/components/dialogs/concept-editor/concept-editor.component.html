<h2 mat-dialog-title>Conceptos de Importaciones</h2><mat-dialog-content><form #f="ngForm" (submit)="$event.preventDefault()"><div class="fields"><div class="concept"><label class="concept-code">Código<input aria-label="Código de concepto" [value]="row.code" readonly></label><app-catalog-combobox label="Concepto" name="concept" [(ngModel)]="row.code" (ngModelChange)="description()" [showCode]="false" [options]="options" [disabled]="!!data.row" required></app-catalog-combobox></div><label>Imp. Soles<input aria-label="Importe soles" name="soles" type="number" [(ngModel)]="row.soles" min="0" max="99999999999.99" step="0.01" (blur)="fromSoles()" (focus)="$any($event.target).select()" required></label><label>Imp. Dólares<input aria-label="Importe dólares" name="dollars" type="number" [(ngModel)]="row.dollars" min="0" max="99999999999.99" step="0.01" (blur)="fromDollars()" (focus)="$any($event.target).select()" required></label><label>Imp. Otros<input aria-label="Importe otros" name="other" type="number" [(ngModel)]="row.other" (ngModelChange)="otherEdited=true" min="0" max="99999999999.99" step="0.01" (blur)="fromOther()" (focus)="$any($event.target).select()" required></label><label class="rate">Tipo de cambio<input name="rate" type="number" [(ngModel)]="row.exchangeRate" min="0.001" max="9999999.999" step="0.001" (blur)="fromDollars()" (focus)="$any($event.target).select()" required></label><label class="equivalence">Equivalencia<input name="equivalence" type="number" [(ngModel)]="equivalence" min="0" max="9999999.999" step="0.001" [disabled]="loading" (focus)="$any($event.target).select()" required></label><label class="document">N.º de proforma<input aria-label="Número de proforma" name="document" [(ngModel)]="row.documentNumber" maxlength="20"></label></div><p role="status" class="muted" *ngIf="loading">Consultando equivalencia…</p><p role="alert" class="feedback error" *ngIf="error">{{error}}</p><p class="muted">El concepto se aplicará al guardar el registro de importación.</p></form></mat-dialog-content><mat-dialog-actions align="end"><button type="button" class="primary" (click)="accept(f)" [disabled]="!isGlobalUser&&(f.invalid||loading)">Aceptar</button><button type="button" mat-dialog-close>Salir</button></mat-dialog-actions>
