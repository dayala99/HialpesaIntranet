<section class="panel register"><div class="register-heading"><h1>{{title}} · Control Calidad{{unfinished ? ' - Tela Por Acabar' : ''}}</h1><button type="button" (click)="completed.emit(false)" [disabled]="busy"><mat-icon>arrow_back</mat-icon>Regresar</button></div>
<p role="alert" class="feedback error" *ngIf="error">{{error}}</p>
<form (submit)="$event.preventDefault()"><fieldset [disabled]="busy"><div class="fields">
<div class="batch-customer"><div class="batch-query"><label>Partida<input (keydown.enter)="$event.preventDefault();loadItems()" name="batch" [(ngModel)]="model.batch" (ngModelChange)="batchChanged()" maxlength="5" [disabled]="action!=='I'" required></label><button class="load-items" type="button" *ngIf="action==='I'" (click)="loadItems()" [disabled]="loading">{{loading?'Consultando…':'Consultar ítems'}}</button></div><label>Cliente<input name="customer" [value]="customer" readonly></label>
<app-catalog-combobox label="Evento" name="eventCode" [(ngModel)]="model.eventCode" [options]="catalog(action==='I'?'validEvents':'events')" [disabled]="busy||action!=='I'"></app-catalog-combobox></div>


</div>
<fieldset [disabled]="action==='D'"><div class="fields">
<label>Fecha de evento<input type="date" name="date" [(ngModel)]="model.date" required></label>
<label>Status<select name="status" [(ngModel)]="model.status" (ngModelChange)="statusChanged()" required><option *ngFor="let o of catalog('statuses')" [value]="o.code">{{o.description}}</option></select></label>
<app-catalog-combobox label="Auditor" name="auditor" [(ngModel)]="model.auditor" [options]="catalog('auditors')" [disabled]="busy||action==='D'"></app-catalog-combobox>
<label>Resultado auditoría externa<select name="externalResult" [(ngModel)]="model.externalResult"><option value="">Sin resultado</option><ng-container *ngFor="let o of catalog('statuses')"><option *ngIf="o.code==='A'||o.code==='R'" [value]="o.code">{{o.description}}</option></ng-container></select></label>
<app-catalog-combobox label="Ubicación de reproceso" name="location" [(ngModel)]="model.location" [options]="catalog('locations')" [disabled]="busy||action==='D'"></app-catalog-combobox>
<ng-container *ngIf="model.status==='R'||model.status==='P'">
<app-catalog-combobox label="Motivo" name="reason" [(ngModel)]="model.reason" [options]="catalog('reasons')" [disabled]="busy||action==='D'"></app-catalog-combobox>
<app-catalog-combobox label="Desviación" name="deviation" [(ngModel)]="model.deviation" [options]="catalog('deviations')" [disabled]="busy||action==='D'"></app-catalog-combobox>
<app-catalog-combobox label="Causa" name="cause" [(ngModel)]="model.cause" [options]="catalog('causes')" [disabled]="busy||action==='D'"></app-catalog-combobox>
</ng-container>
<label>Observaciones<textarea name="observations" [(ngModel)]="model.observations" maxlength="100" rows="3"></textarea></label>
<label>Observación Producción<textarea name="productionObservations" [(ngModel)]="model.productionObservations" maxlength="100" rows="3"></textarea></label>
</div><div class="checks"><label><input type="checkbox" name="forcedError" [(ngModel)]="model.forcedError">Error forzado área</label><label><input type="checkbox" name="dispatched" [(ngModel)]="model.dispatched">Despachado</label></div></fieldset>
<div class="table-scroll" *ngIf="items.length"><table><thead><tr><th><input type="checkbox" name="selectAllItems" [ngModel]="allSelected" (ngModelChange)="selectAll($event)" [indeterminate]="someSelected" [disabled]="action!=='I'" aria-label="Seleccionar todos los ítems"></th><th>Sec.</th><th>Tela</th><th>Color</th><th>Talla</th><th>Kilos</th></tr></thead><tbody><tr *ngFor="let item of items;let i=index"><td><input type="checkbox" [name]="'sel-'+i" [(ngModel)]="item['selected']" [disabled]="action!=='I'" [attr.aria-label]="'Seleccionar ítem '+item['sec']"></td><td>{{item['sec']}}</td><td>{{item['des_tela']}}</td><td>{{item['des_color']}}</td><td>{{item['talla']}}</td><td><input type="number" inputmode="decimal" (focus)="selectNumber($event)" (click)="selectNumber($event)" [name]="'kilos-'+i" [(ngModel)]="item['kilos']" min="0" max="99999999999.99" step="0.01" [disabled]="action==='D'" required [attr.aria-label]="'Kilos ítem '+item['sec']"></td></tr></tbody></table></div>

<div class="actions"><button type="button" (click)="completed.emit(false)" [disabled]="busy">Cancelar</button><button type="button" (click)="save()" class="primary" [disabled]="busy||loading">{{busy?'Procesando…':action==='D'?'Eliminar evento':'Guardar evento'}}</button></div>
</fieldset></form></section>
